name: ci
on: [push, pull_request]
jobs:
  suite:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root  # throwaway CI container, not a real secret
          MYSQL_DATABASE: orderdesk_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/orderdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Clean build must be fully green
        run: python -m pytest -v --junitxml=reports/junit.xml
      - name: Every seeded defect must be caught by at least one test
        run: python scripts/defect_matrix.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/
