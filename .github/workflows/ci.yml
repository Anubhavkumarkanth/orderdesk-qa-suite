name: ci
on: [push, pull_request]
jobs:
  suite:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root  # throwaway CI container, not a real secret
          MYSQL_DATABASE: orderdesk_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/orderdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Clean build must be fully green
        run: python -m pytest -v --junitxml=reports/junit.xml
      - name: Every seeded defect must be caught by at least one test
        run: python scripts/defect_matrix.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/

  demo-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t orderdesk-demo .
      # Same memory as the free host, so an image that needs more fails here first.
      - run: docker run -d --name demo --memory=512m --memory-swap=512m -p 8000:10000 orderdesk-demo
      - name: The demo serves products and takes an order from its own MySQL
        run: |
          curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/api/products | grep -q NB-A5
          curl --fail --silent -X POST http://127.0.0.1:8000/api/orders -H 'Content-Type: application/json'             -d '{"customer_email": "qa@example.com", "items": [{"sku": "NB-A5", "quantity": 1}]}' | grep -q PLACED
          docker stats --no-stream demo
      - if: failure()
        run: docker logs demo
