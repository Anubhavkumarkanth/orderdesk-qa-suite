services:
  - type: web
    name: orderdesk-qa-suite-live
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL  # a hosted MySQL 8 database, mysql://user:password@host:3306/db; set in the Render dashboard
        sync: false
    autoDeployTrigger: checksPass
